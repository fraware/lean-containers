name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Lean 4
      uses: leanprover-community/setup-lean4@v2
      with:
        lean-version: '4.31.0'
        
    - name: Cache Lake dependencies
      uses: actions/cache@v3
      with:
        path: .lake/packages
        key: ${{ runner.os }}-lake-${{ hashFiles('lake-manifest.json') }}
        restore-keys: |
          ${{ runner.os }}-lake-
          
    - name: Build project
      run: lake build
      
    - name: Run tests
      run: |
        lake env lean FinalProductionTest.lean
        lake env lean Examples.lean
        lake env lean CSLibExamples.lean
      
    - name: Test Makefile targets
      run: |
        make build
        make test

  docker:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: docker build -t lean-containers:test .
      
    - name: Test Docker image
      run: docker run --rm lean-containers:test
      
    - name: Test Docker with custom command
      run: docker run --rm lean-containers:test FinalProductionTest.lean

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Validate release metadata consistency
      id: release_vars
      run: |
        TAG="${{ github.event.release.tag_name }}"
        chmod +x scripts/check-release-consistency.sh
        scripts/check-release-consistency.sh "$TAG"
        VERSION="${TAG#v}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.release_vars.outputs.version }}
        
    - name: Create Release Artifacts
      run: |
        TAG="${{ steps.release_vars.outputs.tag }}"
        mkdir -p release
        cp -r src release/
        cp Lakefile.lean release/
        cp VERSION release/
        cp lake-manifest.json release/
        cp lean-toolchain release/
        cp Main.lean release/
        cp FinalProductionTest.lean release/
        cp LICENSE release/
        tar -czf lean-containers-${TAG}.tar.gz -C release .
        
    - name: Upload Release Artifacts
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./lean-containers-${{ github.event.release.tag_name }}.tar.gz
        asset_name: lean-containers-${{ github.event.release.tag_name }}.tar.gz
        asset_content_type: application/gzip
